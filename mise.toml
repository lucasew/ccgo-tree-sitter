[tools]
go = "1.26.4"
uv = "0.11.26"
"go:golang.org/x/tools/gopls" = "0.22.0"
# Places grammar C sources (core:place); also used by CI prepare / add-grammar.
"github:lucasew/workspaced" = "0.14.1"

# Pure-Go default: parse/tests must not require a host C compiler.
# Codegen tasks set CC=clang only where the probe needs it.
[env]
CGO_ENABLED = "0"

# ---------------------------------------------------------------------------
# Local: grammars:sync + test only. Never transpile/codegen on a laptop.
# CI: prepare runs grammars:sync (workspaced), then mise run codegen:* on runners.
# ---------------------------------------------------------------------------

[tasks."grammars:sync"]
description = "Materialise grammar C sources via workspaced core:place"
run = "workspaced codebase apply"

[tasks."grammars:lock"]
description = "Refresh workspaced.lock.json pins for #grammar / #fixture inputs"
run = "workspaced mod lock"

[tasks.install]
run = "go get -v ./..."

[tasks.test]
description = "Run unit tests against host grammars (pure Go, no CGO)"
env = { CGO_ENABLED = "0" }
run = "go test ./..."

# Codegen is CI-only (native runner + preprocessor). Each task places sources
# via workspaced first so a bare `mise run codegen:*` on a runner is complete.

[tasks."codegen:linux-amd64"]
description = "CI-only: transpile for linux/amd64"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "linux", TARGET_GOARCH = "amd64", CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:linux-arm64"]
description = "CI-only: transpile for linux/arm64"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "linux", TARGET_GOARCH = "arm64", CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:linux-386"]
description = "CI-only: transpile for linux/386"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "linux", TARGET_GOARCH = "386", CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:darwin-amd64"]
description = "CI-only: transpile for darwin/amd64"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "darwin", TARGET_GOARCH = "amd64", CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:darwin-arm64"]
description = "CI-only: transpile for darwin/arm64"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "darwin", TARGET_GOARCH = "arm64", CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:windows-amd64"]
description = "CI-only: transpile for windows/amd64 (MinGW gcc -E)"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "windows", TARGET_GOARCH = "amd64", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

[tasks."codegen:windows-arm64"]
description = "CI-only: transpile for windows/arm64 (MinGW gcc -E)"
depends = ["grammars:sync"]
env = { TARGET_GOOS = "windows", TARGET_GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"

# Intentionally no host `codegen` / `codegen:all` convenience — multi-platform
# regen is the CI matrix only (see .github/workflows/ci.yml).
