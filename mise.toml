[tools]
go = "1.26.4"
uv = "0.11.26"
"go:golang.org/x/tools/gopls" = "0.22.0"
# Places grammar C sources (core:place); also used by CI prepare / add-grammar.
"github:lucasew/workspaced" = "0.14.1"
# Clang 14 for leaven (typed LLVM pointers).
"conda:clang" = "14.0.6"

# Pure-Go default: parse/tests must not require a host C compiler after codegen.
[env]
CGO_ENABLED = "0"

[tasks."grammars:sync"]
description = "Refresh vendored grammar C sources via workspaced core:place"
run = "workspaced codebase apply"

[tasks."grammars:lock"]
description = "Refresh workspaced.lock.json pins for tree_sitter / #grammar / #fixture inputs"
run = "workspaced mod lock"

[tasks."tree-sitter:path"]
description = "Print workspaced cache path for tree_sitter (ensure fetch if missing)"
run = "go run ./cmd/codegen print-tree-sitter-path"

[tasks.install]
run = "go get -v ./..."

[tasks.test]
description = "Run unit tests against host grammars (pure Go, no CGO)"
env = { CGO_ENABLED = "0" }
run = "go test ./..."

# Leaven codegen: clang 14 -emit-llvm + go tool leaven (host IR, not multi-GOOS matrix).
[tasks.codegen]
description = "Transpile core + all grammars via clang IR + leaven"
env = { CC = "clang", CGO_ENABLED = "0" }
run = "go run -v ./cmd/codegen"
